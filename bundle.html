nability.",documentedRole:"Lead Systems & Full-Stack Developer: Spearheaded technical requirements analysis, architectural modeling, API design, core banking integration services, and frontend interface development.",keyContributions:["Led the end-to-end analysis, architecture design, and development of the Corporate Internet Banking System.","Constructed resilient backend micro-integrations with internal core banking engines and transactional settlement systems using .NET 8.","Designed and implemented corporate maker-checker multi-tier authorization workflows and cryptographic transaction signing.","Built a high-performance, responsive corporate interface using React 18, TypeScript, and Vite following enterprise UI/UX patterns.","Enforced enterprise security best practices, data encryption at rest and in transit, and defensive error-handling pipelines."],keyFeatures:["Multi-level Corporate Authorization & Maker-Checker Workflows","Real-time Account Balances & Consolidated Multi-Account Dashboards","Bulk Corporate Transfers & Automated Payroll Processing","Secure Electronic Statements & Financial Audit Logs","Core Banking Host Interfacing via High-Speed Secure Channels"],technologies:{backend:[".NET 8","ASP.NET Core Web API","Clean Architecture","Modular Monolith","C#"],frontend:["React 18","TypeScript","Vite","Tailwind CSS"],database:["Microsoft SQL Server","Redis (Caching)"],infrastructure:["HashiCorp Vault","Nginx Load Balancing","Windows Server / Hyper-V"]},availability:"enterprise-private",availabilityLabel:"Private Enterprise Banking Deployment",links:[{label:"Enterprise Case Study",url:"#corporate-ibs",type:"case-study",badgeText:"Institutional Clearance"}],screenshots:[{url:"/Projects_Screenshots/Corporate IBS/cover.png",caption:"Corporate IBS — Modular Monolith Architecture & Transaction Execution View",isPrimary:!0}],metrics:[{label:"Architecture",value:"Clean Modular Monolith"},{label:"Security Standard",value:"Banking-Grade RBAC"},{label:"Client Focus",value:"Corporate & Institutional"}],architectureHighlights:["Separation of Concerns: Domain, Application, Infrastructure, and Presentation layers","Defensive API interceptors with automatic audit logging and session invalidation","Strict Zero-Trust integration with internal banking ledger protocols"]},{id:"smsm-ecosystem",slug:"smsm-ecosystem",title:"Smsm Store Ecosystem (منظومة سمسم)",titleAr:"منظومة سمسم للتجارة الإلكترونية والخدمات اللوجستية",organization:"Tharawat Financial Services & Investment Co.",organizationAr:"شركة ثروات للخدمات المالية والاستثمارية",category:"mobile-ecosystems",categoryLabel:"E-Commerce & Logistics Ecosystem",tier:1,featured:!0,year:"2026",shortDescription:"Comprehensive commercial e-commerce and logistics ecosystem spanning three interconnected mobile applications: Customer App, Merchant/Vendor App, and Delivery Fleet Logistics.",shortDescriptionAr:"منظومة متكاملة للتجارة والخدمات اللوجستية تربط بين تطبيق العملاء وتطبيق التجار وتطبيق التوصيل مع تتبع حي للطلبات.",fullOverview:"Developed, maintained, and comprehensively optimized the multi-app Smsm Ecosystem. The ecosystem orchestrates the complete retail and logistics lifecycle: consumer product discovery and checkout, vendor catalog and order processing, and courier dispatch, navigation, and live delivery status tracking.",businessContext:"Operating an end-to-end multi-party marketplace requires ultra-low latency event synchronization. Orders placed on the consumer side must instantly notify merchants, and ready packages must immediately dispatch to optimal couriers with live geolocation tracking.",engineeringSolution:"Architected cross-platform client applications in Flutter with robust state management and offline resilience, communicating with a scalable Laravel REST backend. Implemented real-time order tracking, localized Arabic/English responsive layouts, and performance optimizations achieving 60fps scrolling across consumer and merchant devices.",documentedRole:"Applications Developer & AI Systems Developer: Responsible for application engineering, UX overhaul, API integration, performance optimization, and release lifecycle management across Google Play.",keyContributions:["Developed and maintained the entire tripartite ecosystem: Customer App, Merchant App, and Delivery Logistics App.","Redeveloped application architectures to drastically reduce jank, improve cold-start times, and stabilize memory consumption.","Implemented responsive, modern touch-first interfaces using Flutter, optimized for both Arabic (RTL) and English.","Connected mobile apps with Laravel backend RESTful services with optimistic UI updates and caching.","Managed release pipelines and publishing to Google Play Store with production compliance."],keyFeatures:["Interactive Consumer Catalog with Instant Search & Multi-Variant Cart","Real-Time Merchant Order Kanban with Kitchen/Dispatch Timers","Courier Dispatch, Geolocation Tracking & Route Navigation","Multi-Wallet Payment Gateway Integration & Instant Settlement","Live Push Notification Pipelines & Order Lifecycle Milestones"],technologies:{frontend:["Flutter","Dart","State Management (Riverpod/Bloc)","RTL/LTR Adaptive UI"],backend:["Laravel","PHP","RESTful APIs","WebSockets / Real-Time Push"],database:["MySQL","Redis"],infrastructure:["Google Play Console","CI/CD Automated Pipelines"]},availability:"public-store",availabilityLabel:"Public on Google Play & Operations Fleet",links:[{label:"Customer App on Google Play",url:"https://play.google.com/store/apps/details?id=com.smsm.customers&hl=en",type:"google-play",badgeText:"Verified Store App"},{label:"Merchant App on Google Play",url:"https://play.google.com/store/apps/details?id=com.smsm.vendor&hl=en",type:"google-play",badgeText:"Verified Store App"}],subApplications:[{name:"Smsm Customer App",role:"Consumer shopping, digital wallet checkout & live order tracking",status:"Live on Google Play",link:"https://play.google.com/store/apps/details?id=com.smsm.customers&hl=en"}
