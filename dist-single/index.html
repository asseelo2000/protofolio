ت وتنفيذ المعاملات المالية الحساسة بأعلى معايير الأمان.",fullOverview:"Led the comprehensive technical analysis, system design, and full-stack development of Yemen Commercial Bank’s next-generation Corporate Internet Banking System (Corporate IBS). The platform empowers institutional clients, corporations, and enterprise entities to oversee accounts, authorize structured corporate transfers, disburse payroll, and audit financial activity securely through a modern responsive interface.",fullOverviewAr:"قيادة التحليل التقني الشامل والتصميم المعماري وتطوير Full-Stack للجيل الجديد من نظام الخدمات المصرفية عبر الإنترنت للشركات (Corporate IBS) في بنك اليمن التجاري. تمكّن المنصة عملاء الشركات والمؤسسات من إدارة الحسابات، واعتماد التحويلات المؤسسية متعددة المستويات، وصرف الرواتب، وتدقيق العمليات المالية بأمان عبر واجهة مستخدم عصرية وسريعة.",businessContext:"Corporate clients required a secure, high-availability platform with granular role-based approvals (maker-checker workflows), strict auditability, and instant synchronization with internal core banking engines without latency or security compromise.",businessContextAr:"احتاج عملاء الشركات إلى منصة مصرفية آمنة وعالية التوفر مع صلاحيات اعتماد هرمية دقيقة (Maker-Checker)، وتدقيق مالي صارم، وتزامن فوري مع أنظمة البنك الأساسية (Core Banking) دون أي تأخير أو مخاطر أمنية.",engineeringSolution:"Designed a Clean Architecture Modular Monolith using .NET 8 (ASP.NET Core Web API) on the backend and React 18 with TypeScript and Vite on the frontend. Established rigorous cryptographic handshakes, secure session state, and automated integration pipelines to internal ledger services while maintaining modular maintainability.",engineeringSolutionAr:"تصميم بنية معمارية أحادية معيارية (Modular Monolith) بأسلوب Clean Architecture باستخدام .NET 8 (ASP.NET Core Web API) في الواجهة الخلفية، وReact 18 مع TypeScript وVite في الواجهة الأمامية. تطبيق بروتوكولات تشفير متقدمة، وإدارة آمنة للجلسات، وربط متكامل مع سجلات الحسابات المصرفية مع الحفاظ على قابلية التوسع والصيانة.",documentedRole:"Lead Systems & Full-Stack Developer: Spearheaded technical requirements analysis, architectural modeling, API design, core banking integration services, and frontend interface development.",documentedRoleAr:"مطور أنظمة ومطور Full-Stack رئيسي: قيادة تحليل المتطلبات التقنية، والنمذجة المعمارية، وتصميم واجهات برمجة التطبيقات (APIs)، وخدمات الربط المصرفي الأساسي، وتطوير الواجهات الأمامية.",keyContributions:["Led the end-to-end analysis, architecture design, and development of the Corporate Internet Banking System.","Constructed resilient backend micro-integrations with internal core banking engines and transactional settlement systems using .NET 8.","Designed and implemented corporate maker-checker multi-tier authorization workflows and cryptographic transaction signing.","Built a high-performance, responsive corporate interface using React 18, TypeScript, and Vite following enterprise UI/UX patterns.","Enforced enterprise security best practices, data encryption at rest and in transit, and defensive error-handling pipelines."],keyContributionsAr:["قيادة التحليل الشامل والتصميم المعماري وتطوير نظام الخدمات المصرفية عبر الإنترنت للشركات.","بناء خدمات ربط خلفية عالية المرونة مع أنظمة البنك المصرفية الأساسية ومحركات التسوية المالية بـ .NET 8.","تصميم وتنفيذ مسارات اعتماد العمليات المؤسسية متعددة المستويات (Maker-Checker) والتوقيع الرقمي للتحويلات.","بناء واجهة مستخدم مؤسسية متجاوبة وعالية الأداء بـ React 18 وTypeScript وVite وفق أرقى معايير UI/UX.","تطبيق أفضل ممارسات الأمان المصرفي، وتشفير البيانات أثناء النقل والتخزين، وبناء مسارات معالجة الأخطاء الدفاعية."],keyFeatures:["Multi-level Corporate Authorization & Maker-Checker Workflows","Real-time Account Balances & Consolidated Multi-Account Dashboards","Bulk Corporate Transfers & Automated Payroll Processing","Secure Electronic Statements & Financial Audit Logs","Core Banking Host Interfacing via High-Speed Secure Channels"],keyFeaturesAr:["مسارات صلاحيات واعتماد مؤسسية متعددة المستويات (Maker-Checker)","أرصدة لحظية ولوحات تحكم موحدة لكافة الحسابات الفرعية والمؤسسية","التحويلات المؤسسية المجمعة ومعالجة كشوفات صرف الرواتب الآلية","كشوفات حسابات إلكترونية مؤمنة وسجلات تدقيق مالي تفصيلية","قنوات اتصال مصرفية عالية السرعة ومشفرة مع الأنظمة الرئيسية"],technologies:{backend:[".NET 8","ASP.NET Core Web API","Clean Architecture","Modular Monolith","C#"],frontend:["React 18","TypeScript","Vite","Tailwind CSS"],database:["Microsoft SQL Server","Redis (Caching)"],infrastructure:["HashiCorp Vault","Nginx Load Balancing","Windows Server / Hyper-V"]},availability:"enterprise-private",availabilityLabel:"Private Enterprise Banking Deployment",availabilityLabelAr:"نظام مصرفي مؤسسي خاص",links:[{label:"Enterprise Case Study",labelAr:"دراسة حالة مصرفية مؤسسية",url:"#corporate-ibs",type:"case-study",badgeText:"Institutional Clearance",badgeTextAr:"تصريح مؤسسي"}],screenshots:[{url:"/Projects_Screenshots/Corporate IBS/cover.png",caption:"Corporate IBS — Modular Monolith Architecture & Transaction Execution View",captionAr:"نظام Corporate IBS — معمارية Modular Monolith وشاشات تنفيذ العمليات",isPrimary:!0}],metrics:[{label:"Architecture",value:"Clean Modular Monolith"},{label:"Security Standard",value:"Banking-Grade RBAC"},{label:"Client Focus",value:"Corporate & Institutional"}],metricsAr:[{label:"المعمارية",value:"Clean Modular Monolith"},{label:"معيار الأمان",value:"أمان مصرفي صارم RBAC"},{label:"فئة العملاء",value:"الشركات والمؤسسات"}],architectureHighlights:["Separation of Concerns: Domain, Application, Infrastructure, and Presentation layers","Defensive API interceptors with automatic audit logging and session invalidation","Strict Zero-Trust integration with internal banking ledger protocols"],architectureHighlightsAr:["فصل صارم للمسؤوليات: طبقات النطاق (Domain)، التطبيق (Application)، البنية التحتية، والعرض","اعتراض دفاعي للطلبات البرمجية (API Interceptors) مع تسجيل تدقيق تلقائي وإلغاء فوري للجلسات غير الصالحة","تكامل صارم بنهج Zero-Trust مع بروتوكولات سجلات الحسابات المصرفية"]},{id:"smsm-ecosystem",slug:"smsm-ecosystem",title:"Smsm Store Ecosystem (منظومة سمسم)",titleAr:"منظومة سمسم للتجارة الإلكترونية والخدمات اللوجستية",organization:"Tharawat Financial Services & Investment Co.",organizationAr:"شركة ثروات للخدمات المالية والاستثمارية",category:"mobile-ecosystems",categoryLabel:"E-Commerce & Logistics Ecosystem",categoryLabelAr:"منظومة التجارة والخدمات اللوجستية",tier:1,featured:!0,year:"2026",shortDescription:"Comprehensive commercial e-commerce and logistics ecosystem spanning three interconnected mobile applications: Customer App, Merchant/Vendor App, and Delivery Fleet Logistics.",shortDescriptionAr:"منظومة متكاملة للتجارة والخدمات اللوجستية تربط بين تطبيق العملاء وتطبيق التجار وتطبيق التوصيل مع تتبع حي للطلبات.",fullOverview:"Developed, maintained, and comprehensively optimized the multi-app Smsm Ecosystem. The ecosystem orchestrates the complete retail and logistics lifecycle: consumer product discovery and checkout, vendor catalog and order processing, and courier dispatch, navigation, and live delivery status tracking.",fullOverviewAr:"تطوير وصيانة وإعادة هيكلة شاملة لمنظومة متجر سمسم متعددة التطبيقات. تدير المنظومة دورة التجارة والخدمات اللوجستية بالكامل: تصفح المنتجات والشراء للمستهلك، وإدارة المنتجات والمخزون ومعالجة الطلبات للتجار، وإسناد الطلبات والتوجيه والملاحة والتتبع المباشر لأسطول التوصيل.",businessContext:"Operating an end-to-end multi-party marketplace requires ultra-low latency event synchronization. Orders placed on the consumer side must instantly notify merchants, and ready packages must immediately dispatch to optimal couriers with live geolocation tracking.",businessContextAr:"تشغيل سوق تجاري متعدد الأطراف يتطلب تزامن لحظي فائق السرعة للأحداث؛ فالطلب المنفذ من العميل يجب أن يصل فوراً للتاجر للتجهيز، ثم يُسند مباشرة إلى أقرب مندوب توصيل مع تتبع الموقع الجغرافي الحي.",engineeringSolution:"Architected cross-platform client applications in Flutter with robust state management and offline resilience, communicating with a scalable Laravel REST backend. Implemented real-time order tracking, localized Arabic/English responsive layouts, and performance optimizations achieving 60fps scrolling across consumer and merchant devices.",engineeringSolutionAr:"بناء تطبيقات الهواتف المحمولة بـ Flutter مع إدارة حالة متينة ومرونة في العمل دون اتصال، والربط مع خدمات Laravel RESTful سحابية. تنفيذ تتبع فوري للطلبات، وتصميم واجهات متكيفة بالكامل مع العربية والإنجليزية، وتحقيق معدل إطارات سلس 60 إطاراً في الثانية.",documentedRole:"Applications Developer & AI Systems Developer: Responsible for application engineering, UX overhaul, API integration, performance optimization, and release lifecycle management across Google Play.",documentedRoleAr:"مطور تطبيقات ومطور أنظمة ذكاء اصطناعي: مسؤول عن هندسة التطبيقات، وتطوير تجربة المستخدم، وتكامل واجهات برمجة التطبيقات، وتحسين الأداء، وإدارة دورة إطلاق التطبيقات على Google Play.",keyContributions:["Developed and maintained the entire tripartite ecosystem: Customer App, Merchant App, and Delivery Logistics App.","Redeveloped application architectures to drastically reduce jank, improve cold-start times, and stabilize memory consumption.","Implemented responsive, modern touch-first interfaces using Flutter, optimized for both Arabic (RTL) and English.","Connected mobile apps with Laravel backend RESTful services with optimistic UI updates and caching.","Managed release pipelines and publishing to Google Play Store with production compliance."],keyContributionsAr:["تطوير وصيانة المنظومة الثلاثية المتكاملة: تطبيق العملاء، تطبيق التجار، وتطبيق أسطول التوصيل.","إعادة هيكلة بنية التطبيقات لتقليل زمن التشغيل الأولي، ومنع التعليق، واستقرار استهلاك الذاكرة.","تصميم واجهات مستخدم لمسية حديثة ومتجاوبة بـ Flutter مع تعريب كامل (RTL) ودعم الإنجليزية (LTR).","ربط التطبيقات مع خدمات Laravel الخلفية مع التحديث الفوري للواجهات والتخزين المؤقت.","إدارة مسار النشر والتحديثات على متجر Google Play وفق معايير الجودة والامتثال."],keyFeatures:["Interactive Consumer Catalog with Instant Search & Multi-Variant Cart","Real-Time Merchant Order Kanban with Kitchen/Dispatch Timers","Courier Dispatch, Geolocation Tracking & Route Navigation","Multi-Wallet Payment Gateway Integration & Instant Settlement","Live Push Notification Pipelines & Order Lifecycle Milestones"],keyFeaturesAr:["كتالوج تفاعلي للمستهلك مع بحث فوري وسلة تسوق متعددة المتغيرات","لوحة كانبان فورية للتجار مع مؤقتات لتجهيز وتحضير الطلبات","إسناد فوري لأسطول التوصيل مع ملاحة وتتبع للموقع الجغرافي (GPS)","بوابات دفع إلكترونية متعددة المحافظ وتسوية مالية فورية","إشعارات لحظية تتبع كافة مراحل ومحطات دورة حياة الطلب"],technologies:{frontend:["Flutter","Dart","State Management (Riverpod/Bloc)","RTL/LTR Adaptive UI"],backend:["Laravel","PHP","RESTful APIs","WebSockets / Real-Time Push"],database:["MySQL","Redis"],infrastructure:["Google Play Console","CI/CD Automated Pipelines"]},availability:"public-store",availabilityLabel:"Public on Google Play & Operations Fleet",availabilityLabelAr:"متوفر على متجر Google Play وأسطول التوصيل",links:[{label:"Customer App on Google Play",labelAr:"تطبيق العملاء على Google Play",url:"https://play.google.com/store/apps/details?id=com.smsm.customers&hl=en",type:"google-play",badgeText:"Verified Store App",badgeTextAr:"تطبيق متجر معتمد"},{label:"Merchant App on Google Play",labelAr:"تطبيق التجار على Google Play",url:"https://play.google.com/store/apps/details?id=com.smsm.vendor&hl=en",type:"google-play",badgeText:"Verified Store App",badgeTextAr:"تطبيق متجر معتمد"}],subApplications:[{name:"Smsm Customer App",role:"Consumer shopping, digital wallet checkout & live order tracking",status:"Live on Google Play",link:"https://play.google.com/store/apps/details?id=com.smsm.customers&hl=en"},{name:"Smsm Merchant / Vendor App",role:"Catalog management, inventory control & live order fulfillment",status:"Live on Google Play",link:"https://play.google.com/store/apps/details?id=com.smsm.vendor&hl=en"},{name:"Smsm Delivery Fleet App",role:"Driver dispatch, order pickup, turn-by-turn guidance & status sync",status:"Enterprise Private Fleet Deployment"}],subApplicationsAr:[{name:"تطبيق سمسم للعملاء",role:"التسوق والشراء، الدفع بالمحافظ الإلكترونية، والتتبع اللحظي للطلبات",status:"متاح على Google Play",link:"https://play.google.com/store/apps/details?id=com.smsm.customers&hl=en"},{name:"تطبيق سمسم للتجار",role:"إدارة كتالوج المنتجات، التحكم بالمخزون، ومعالجة الطلبات الفورية",status:"متاح على Google Play",link:"https://play.google.com/store/apps/details?id=com.smsm.vendor&hl=en"},{name:"تطبيق أسطول التوصيل",role:"استلام الطلبات، التوجيه خطوة بخطوة عبر الخرائط، وتزامن حالة التسليم",status:"تطبيق أسطول خاص"}],screenshots:[{url:"/Projects_Screenshots/smsm_ecosystem/cover.png",caption:"Smsm Ecosystem — Tripartite Architecture: Customer, Merchant, and Fleet Logistics",captionAr:"منظومة سمسم — المعمارية الثلاثية: تطبيق العملاء والتجار وأسطول التوصيل",isPrimary:!0}],metrics:[{label:"Ecosystem Scope",value:"3 Interconnected Apps"},{label:"Platform Engine",value:"Flutter + Laravel"},{label:"Public Apps",value:"2 on Google Play"}],metricsAr:[{label:"نطاق المنظومة",value:"3 تطبيقات مترابطة"},{label:"المحرك التقني",value:"Flutter + Laravel"},{label:"التطبيقات العامة",value:"تطبيقان على Google Play"}]},{id:"abu-meska-construction",slug:"abu-meska-construction",title:"Abu Meska Construction Corporate Platform",titleAr:"الموقع التعريفي لشركة أبو مسكة للمقاولات العامة",organization:"Abu Meska Construction Company",organizationAr:"شركة أبو مسكة للمقاولات",category:"web-platforms",categoryLabel:"Corporate Web & 3D Experience",categoryLabelAr:"المواقع المؤسسية والتجارب ثلاثية الأبعاد",tier:1,featured:!0,year:"2025",shortDescription:"High-performance bilingual corporate web experience featuring interactive Three.js 3D elements, fluid Framer Motion transitions, and automated enterprise inquiries.",shortDescriptionAr:"موقع إلكتروني مؤسسي متقدم ثنائي اللغة مزود بعناصر ثلاثية الأبعاد تفاعلية بتقنية Three.js ورسوم متحركة انسيابية.",fullOvervi  interactive Three.js 3D web elements that enhance depth without sacrificing mobile battery or frame rates.","Implemented fluid directional animations using Framer Motion with full RTL/LTR layout symmetry.","Constructed automated enterprise email dispatch pipelines for project bids and inquiries.","Achieved near-perfect Lighthouse performance scores through asset compression and lazy rendering."],keyContributionsAr:["تصميم وهندسة واجهة أمامية حديثة باستخدام React 19 وVite وTailwind CSS.","إنشاء عناصر ويب تفاعلية ثلاثية الأبعاد بـ Three.js تعزز العمق البصري دون التأثير على سلاسة العرض.","تنفيذ انتقالات حركية انسيابية باستخدام Framer Motion مع توافق كامل بين RTL وLTR.","بناء مسار إرسال بريدي آلي لاستقبال العروض والاستفسارات الهندسية.","تحقيق أعلى مؤشرات الأداء في فحص Lighthouse بفضل ضغط الموارد والتحميل الكسول."],keyFeatures:["Interactive 3D Engineering Model & Topographic Background via Three.js","Complete Bilingual System (Arabic & English) with Layout Flip","Interactive Portfolio Galleries for Heavy Infrastructure Projects","Automated Corporate Inquiry Pipeline with Direct Email Dispatch","Sub-second First Contentful Paint with Vite Build Optimization"],keyFeaturesAr:["نموذج هندسي وتضاريسي تفاعلي 3D في الخلفية بتقنية Three.js","نظام ثنائي اللغة متكامل (العربية والإنجليزية) مع قلب كامل للواجهة","معارض أعمال تفاعلية لمشاريع البنية التحتية والمقاولات الضخمة","مسار استفسارات مؤسسي آلي مرتبط بالبريد الإلكتروني للإدارة","زمن تحميل أولي فائق السرعة مدعوم ببناء Vite المحسن"],technologies:{frontend:["React 19","Vite","Three.js (WebGL)","Tailwind CSS","Framer Motion"],infrastructure:["Vercel / Cloud Edge","Automated Email Integration"]},availability:"public-web",availabilityLabel:"Public Live Production Website",availabilityLabelAr:"موقع إلكتروني مباشر قيد التشغيل",links:[{label:"Visit Live Corporate Website",labelAr:"زيارة الموقع الإلكتروني المباشر",url:"https://abomiska.org/",type:"website",badgeText:"Live Production",badgeTextAr:"مباشر على الإنترنت"}],screenshots:[{url:"/
